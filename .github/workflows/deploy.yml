name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: orecalculator/package-lock.json

      - name: Install dependencies
        working-directory: orecalculator
        run: npm ci

      - name: Build orecalculator
        working-directory: orecalculator
        run: npm run build

      - name: Prepare site
        run: |
          mkdir -p _site
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='orecalculator/' \
            --exclude='_site/' \
            ./ _site/

          mkdir -p _site/orecalculator
          cp -R orecalculator/dist/. _site/orecalculator/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4